[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightfall-endstation-602"
description = "Lightfall plugin for the ALS 6.0.2 (QERLIN) endstation"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "lightfall",
    "loguru",
    "numpy",
    "ophyd>=1.6",
    "bluesky>=1.8",
    "pyqtgraph",
    "qtpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.entry-points."lightfall.plugins"]
endstation_602 = "lightfall_endstation_602.manifest:manifest"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_endstation_602"]

[tool.pytest.ini_options]
testpaths = ["tests"]
